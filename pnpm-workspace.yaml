packages:
  - "apps/*"
  - "packages/*"
  - "packages/domain/*"
  - "packages/application/*"
  - "packages/infrastructure/*"

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - "@google/genai"
  - "esbuild"
  - "protobufjs"
  - "sharp"
  - "simple-git-hooks"
