name: Production Gate Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  production-gate:
    name: Production Hardening Certification Gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Pre-Deploy Certification Gate
        run: node scripts/pre-deploy-gate.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://portal.clasptek.org
          NEXT_PUBLIC_APP_URL: https://portal.clasptek.org
          NODE_ENV: production
