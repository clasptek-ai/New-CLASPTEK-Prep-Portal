<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1140" height="60" rx="8" fill="url(#headerGrad)" />
  <text x="600" y="52" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="0.5">
    THE PROCESS OF DIAMOND PRODUCTION: FROM THE MINE TO THE RETAILER
  </text>
  <text x="600" y="72" text-anchor="middle" fill="#bae6fd" font-size="13">
    IELTS Academic Writing Task 1 — Process Flow Chart
  </text>

  <!-- STAGE 1: Mining & Extraction -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">1. MINING &amp; EXTRACTION</text>
    
    <!-- Icon / Graphic: Mine -->
    <g transform="translate(110, 48)">
      <path d="M 10 40 L 50 5 L 90 40 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
      <rect x="35" y="22" width="30" height="28" fill="#334155" />
      <path d="M 0 50 L 100 50" stroke="#64748b" stroke-width="3" />
      <circle cx="20" cy="45" r="4" fill="#cbd5e1" />
      <circle cx="80" cy="45" r="5" fill="#cbd5e1" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Underground &amp; Open-Cast Mining</text>
    <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="12">• Kimberlite pipe drilling and blasting</text>
    <text x="160" y="168" text-anchor="middle" fill="#475569" font-size="12">• Excavation of diamond-bearing ore</text>
    <text x="160" y="188" text-anchor="middle" fill="#475569" font-size="12">• Transported via heavy haul trucks</text>
    <rect x="40" y="200" width="240" height="20" rx="4" fill="#e2e8f0" />
    <text x="160" y="214" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Output: Raw Kimberlite Ore</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="380" y1="230" x2="425" y2="230" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STAGE 2: Crushing & Separation -->
  <g transform="translate(440, 115)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">2. CRUSHING &amp; SEPARATION</text>
    
    <!-- Graphic: Crusher / Sieve -->
    <g transform="translate(110, 48)">
      <rect x="20" y="10" width="60" height="20" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5" />
      <polygon points="30,30 70,30 60,50 40,50" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
      <circle cx="45" cy="40" r="2" fill="#38bdf8" />
      <circle cx="55" cy="38" r="2.5" fill="#38bdf8" />
      <circle cx="50" cy="45" r="2" fill="#38bdf8" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Primary &amp; Secondary Processing</text>
    <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="12">• Mechanical crushing into smaller pieces</text>
    <text x="160" y="168" text-anchor="middle" fill="#475569" font-size="12">• Dense Media Separation (DMS) &amp; washing</text>
    <text x="160" y="188" text-anchor="middle" fill="#475569" font-size="12">• X-ray luminescence recovery</text>
    <rect x="40" y="200" width="240" height="20" rx="4" fill="#e2e8f0" />
    <text x="160" y="214" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Output: Uncut Rough Diamonds</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="770" y1="230" x2="815" y2="230" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STAGE 3: Sorting & Classification -->
  <g transform="translate(830, 115)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">3. SORTING &amp; CLASSIFICATION</text>
    
    <!-- Graphic: Two Categories -->
    <g transform="translate(110, 48)">
      <polygon points="50,5 65,22 50,45 35,22" fill="url(#gemGrad)" stroke="#0369a1" stroke-width="1.2" />
      <polygon points="20,18 30,28 20,40 10,28" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
      <polygon points="80,18 90,28 80,40 70,28" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Grading by Size, Shape &amp; Quality</text>
    <text x="160" y="148" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">A. Gem Quality (approx. 20%)</text>
    <text x="160" y="165" text-anchor="middle" fill="#64748b" font-size="11">Sent to specialized cutting centres</text>
    <text x="160" y="185" text-anchor="middle" fill="#64748b" font-size="12" font-weight="bold">B. Industrial Grade (approx. 80%)</text>
    <text x="160" y="202" text-anchor="middle" fill="#64748b" font-size="11">Used for drill bits, saws &amp; abrasives</text>
  </g>

  <!-- Arrow 3 -> 4 (Downwards curve) -->
  <path d="M 990 355 L 990 395 L 990 410" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowDown)" />

  <!-- STAGE 4: Cutting & Shaping -->
  <g transform="translate(830, 430)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">4. CUTTING &amp; SHAPING</text>
    
    <!-- Graphic: Laser & Saw -->
    <g transform="translate(110, 48)">
      <line x1="50" y1="5" x2="50" y2="25" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,2" />
      <polygon points="50,25 70,35 50,50 30,35" fill="url(#gemGrad)" stroke="#0369a1" stroke-width="1.5" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Precision Gem Transformation</text>
    <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="12">• 3D optical scanning and mapping</text>
    <text x="160" y="168" text-anchor="middle" fill="#475569" font-size="12">• Laser sawing or cleaving rough stone</text>
    <text x="160" y="188" text-anchor="middle" fill="#475569" font-size="12">• Bruting (rounding the diamond girdle)</text>
    <rect x="40" y="200" width="240" height="20" rx="4" fill="#e2e8f0" />
    <text x="160" y="214" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Output: Shaped Diamond Preforms</text>
  </g>

  <!-- Arrow 4 -> 5 (Leftwards) -->
  <line x1="820" y1="545" x2="775" y2="545" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STAGE 5: Polishing & Certification -->
  <g transform="translate(440, 430)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">5. POLISHING &amp; GRADING</text>
    
    <!-- Graphic: Faceted Gem & Certificate -->
    <g transform="translate(110, 45)">
      <polygon points="50,8 75,20 50,48 25,20" fill="url(#gemGrad)" stroke="#0369a1" stroke-width="1.5" />
      <line x1="25" y1="20" x2="75" y2="20" stroke="#ffffff" stroke-width="1" />
      <line x1="50" y1="8" x2="50" y2="48" stroke="#ffffff" stroke-width="1" />
      <rect x="68" y="22" width="22" height="28" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1" />
      <line x1="72" y1="28" x2="86" y2="28" stroke="#0284c7" stroke-width="1.5" />
      <line x1="72" y1="34" x2="86" y2="34" stroke="#94a3b8" stroke-width="1" />
      <line x1="72" y1="40" x2="82" y2="40" stroke="#94a3b8" stroke-width="1" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Faceting &amp; Laboratory Inspection</text>
    <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="12">• Facet polishing with revolving wheel (scaif)</text>
    <text x="160" y="168" text-anchor="middle" fill="#475569" font-size="12">• Acid boiling &amp; final ultrasonic cleaning</text>
    <text x="160" y="188" text-anchor="middle" fill="#475569" font-size="12">• 4Cs Certification (Cut, Colour, Clarity, Carat)</text>
    <rect x="40" y="200" width="240" height="20" rx="4" fill="#e2e8f0" />
    <text x="160" y="214" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Output: Certified Polished Gemstones</text>
  </g>

  <!-- Arrow 5 -> 6 (Leftwards) -->
  <line x1="430" y1="545" x2="385" y2="545" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STAGE 6: Jewellery Setting & Retail -->
  <g transform="translate(50, 430)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#0284c7" />
    <rect x="0" y="26" width="320" height="10" fill="#0284c7" />
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">6. JEWELLERY &amp; RETAIL</text>
    
    <!-- Graphic: Ring / Store -->
    <g transform="translate(110, 48)">
      <circle cx="50" cy="32" r="16" fill="none" stroke="#eab308" stroke-width="3.5" />
      <polygon points="50,8 58,16 50,22 42,16" fill="url(#gemGrad)" stroke="#0369a1" stroke-width="1" />
    </g>

    <text x="160" y="125" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Mounting &amp; Distribution</text>
    <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="12">• Setting in gold / platinum jewellery</text>
    <text x="160" y="168" text-anchor="middle" fill="#475569" font-size="12">• Secure distribution to wholesale centres</text>
    <text x="160" y="188" text-anchor="middle" fill="#475569" font-size="12">• Retail display in jewellery boutiques</text>
    <rect x="40" y="200" width="240" height="20" rx="4" fill="#e2e8f0" />
    <text x="160" y="214" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Final Stage: Sold to Consumers</text>
  </g>

  <!-- Summary Footer Note -->
  <text x="600" y="682" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">
    Overall, the linear process involves six key stages: beginning with ore extraction at the mine, through industrial sorting, specialized cutting, polishing, and culminating in retail jewellery distribution.
  </text>
</svg>